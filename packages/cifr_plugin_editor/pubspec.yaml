name: cifr_plugin_editor
description: Multi-tab syntax-highlighted code editor and workspace file explorer plugin for Cifr.
version: 0.0.1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.1
  cifr_plugin_api:
    path: ../cifr_plugin_api
  cifr_coding_core:
    path: ../../../../CifrCoder/Community/UI/packages/cifr_coding_core
  cifr_plugin_diff:
    path: ../cifr_plugin_diff
  cifr_plugin_terminal:
    path: ../cifr_plugin_terminal
  cifr_plugin_mutations:
    path: ../cifr_plugin_mutations
  flutter_code_editor: ^0.3.5
  highlight: ^0.7.0
  gap: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
